<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PageHub editor · plain HTML</title>
    <!-- The editor's stylesheet, already compiled. Every rule is scoped to the editor, so it never restyles this page. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@pagehub/editor@0.1.0-alpha.0/dist/styles.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; padding: 6px 12px; font: 13px system-ui; background: #f6f6f4; color: #1c1c1a; border-bottom: 1px solid #ddd; }
      header span { opacity: 0.6; }
      header button { margin-left: auto; }
      #editor { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <header>
      <strong>PageHub editor · plain HTML</strong>
      <span>Edits are saved in this browser.</span>
      <button type="button" id="reset">Start over</button>
    </header>
    <div id="editor"></div>

    <script type="module">
      // No build step: the packages come from esm.sh, which bundles their dependencies (React included).
      import { mountEditor } from "https://esm.sh/@pagehub/editor@0.1.0-alpha.0";
      import { MediaManager } from "https://esm.sh/@pagehub/editor@0.1.0-alpha.0/components";
      import { memoryStorage } from "https://esm.sh/@pagehub/engine@0.1.0-alpha.0";
      import { classesInMarkup } from "https://esm.sh/@pagehub/engine@0.1.0-alpha.0/render";
      import { compile } from "https://esm.sh/tailwindcss@4.2.2";
      import { SITE_FILES } from "./site.js";

      const KEY = "pagehub-demo:vanilla-html";

      // Storage: the engine's memory storage, with every save copied to localStorage.
      function load() {
        try {
          const saved = localStorage.getItem(KEY);
          if (saved) return JSON.parse(saved);
        } catch {}
        return { ...SITE_FILES };
      }
      const memory = memoryStorage(load());
      const persist = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(memory.snapshot()));
        } catch {}
      };
      const storage = {
        ...memory,
        async write(...args) {
          const result = await memory.write(...args);
          if (result.ok) persist();
          return result;
        },
        async writeBatch(...args) {
          const result = await memory.writeBatch(...args);
          if (result.ok) persist();
          return result;
        },
      };

      // The canvas's stylesheet: Tailwind compiled in the browser from the classes the site's files use.
      const tailwind = compile(`@import "tailwindcss";`, {
        loadStylesheet: async () => ({
          path: "tailwindcss/index.css",
          base: "/",
          content: await (await fetch("https://cdn.jsdelivr.net/npm/tailwindcss@4.2.2/index.css")).text(),
        }),
      });
      async function siteCss(state) {
        const classes = new Set();
        for (const text of state.files.values()) for (const c of classesInMarkup(text)) classes.add(c);
        return (await tailwind).build([...classes]);
      }

      mountEditor(document.getElementById("editor"), { storage, canvasHost: { siteCss }, components: { MediaManager } });

      document.getElementById("reset").addEventListener("click", () => {
        try {
          localStorage.removeItem(KEY);
        } catch {}
        location.reload();
      });
    </script>
  </body>
</html>
